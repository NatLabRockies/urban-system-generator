name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-14
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (CPU torch)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then pip install torch; else pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (no network)
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
          python - <<'EOF'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          size = wheel.stat().st_size / 1e6
          assert size < 100, f"wheel too large for PyPI: {size:.1f} MB"
          names = zipfile.ZipFile(wheel).namelist()
          assert not any(n.endswith((".pkl", ".keras")) for n in names), "legacy artifacts in wheel"
          print(f"{wheel.name}: {size:.1f} MB, {len(names)} files")
          EOF

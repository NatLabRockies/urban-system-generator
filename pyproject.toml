[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-system-generator"
version = "0.1.0"
description = "Machine learning tool for completing building attributes in urban energy models"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Rawad El Kontar", email = "rawad.elkontar@nrel.gov" }
]
maintainers = [
  { name = "Rawad El Kontar", email = "rawad.elkontar@nrel.gov" }
]
keywords = ["urban", "energy", "buildings", "machine-learning", "data-completion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "tensorflow>=2.10.0",
  "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=3.0.0",
  "black>=22.0.0",
  "flake8>=4.0.0",
]
docs = [
  "sphinx>=4.0.0",
  "sphinx-rtd-theme>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/NREL/urban-system-generator"
Repository = "https://github.com/NREL/urban-system-generator"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["usg*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
usg = ["*.py"]

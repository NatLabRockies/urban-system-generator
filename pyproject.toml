[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "urban-system-generator"
dynamic = ["version"]
description = "Generative AI and machine learning for characterization in urban energy models"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rawad El Kontar", email = "rawad.elkontar@nlr.gov" }]
maintainers = [{ name = "Rawad El Kontar", email = "rawad.elkontar@nlr.gov" }]
keywords = ["AI", "artificial-intelligence", "machine-learning", "generative-AI",
            "deep-learning", "pytorch", "urban", "energy-modeling", "buildings",
            "ResStock", "URBANopt", "imputation", "diffusion", "uncertainty"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "click>=8.1",
  "torch>=2.2",
  "safetensors>=0.4",
  "platformdirs>=3",
  "filelock>=3.12",
  "packaging>=23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "build", "twine"]

[project.scripts]
usg = "usg.cli:main"
urban-system-generator = "usg.cli:main"

[project.urls]
Homepage = "https://github.com/NatLabRockies/urban-system-generator"
Repository = "https://github.com/NatLabRockies/urban-system-generator"
Issues = "https://github.com/NatLabRockies/urban-system-generator/issues"

[tool.hatch.version]
path = "src/usg/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/usg"]
artifacts = ["src/usg/resources/bundles/**", "!src/usg/resources/bundles/*/.verified*"]

# `python -m build` builds the wheel from the sdist, so the sdist carries the embedded bundles too.
[tool.hatch.build.targets.sdist]
artifacts = ["src/usg/resources/bundles/**", "!src/usg/resources/bundles/*/.verified*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
  "network: requires internet access (nightly only)",
  "slow: long-running test",
]

[tool.ruff]
line-length = 110
target-version = "py310"
